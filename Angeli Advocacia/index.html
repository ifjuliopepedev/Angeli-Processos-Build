<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- Mantendo favicon do antigo -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://github.com/ifjuliopepedev/Angeli-Processos-Backend/blob/main/favicon.png?raw=true">

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- Mantendo título antigo -->
    <title>Angeli Advocacia</title>
  </head>

  <body style="text-align: center; padding: 0; border: 0; margin: 0;" width="100%" overflow="hidden;">
    <!-- Canvas adaptado para tela cheia mas mantendo background antigo -->
    <canvas id="unity-canvas" width="730" height="1200" tabindex="-1" style="width: 100%; height: 100%; background-color: #162441; position: fixed;"></canvas>

    <script src="Build/Angeli Advocacia.loader.js"></script>
    <script>
      // Mobile detection e ajuste de viewport (mantendo do novo index)
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      // Criando instância do Unity (mantendo paths e nomes antigos)
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Angeli Advocacia.data",
        frameworkUrl: "Build/Angeli Advocacia.framework.js",
        codeUrl: "Build/Angeli Advocacia.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Julio Pepe",
        productName: "Angeli Advocacia",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false,
        // devicePixelRatio: 1,
      }).then((unityInstance) => {
        // Aqui você pode adicionar código pós-load, se precisar
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
