<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Angeli Advocacia</title>

  <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

  <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/ifjuliopepedev/Angeli-Processos-Backend/main/favicon.png">

  <link rel="apple-touch-icon"
        href="https://raw.githubusercontent.com/ifjuliopepedev/Angeli-Processos-Backend/main/favicon.png">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #192C4D;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #192C4D;
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    /* LOADING */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #192C4D;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loader {
      text-align: center;
      color: white;
    }

    #loader img {
      width: 126px;
      height: auto;
      margin-bottom: 20px;
    }

    .dots span {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 6px;
      background: white;
      border-radius: 50%;
      animation: bounce 1.4s infinite both;
    }

    .dots span:nth-child(1) { animation-delay: 0s; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div id="loading-overlay">
    <div id="loader">
      <img
        src="https://github.com/ifjuliopepedev/Angeli-Processos-Backend/blob/main/AngeliLoadingIcon.png?raw=true"
        alt="Carregando">

      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p>Carregando, isso levará apenas alguns instantes.</p>
    </div>
  </div>

  <!-- UNITY -->
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script src="Build/123.loader.js"></script>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.getElementById("loading-overlay");

    createUnityInstance(canvas, {
      dataUrl: "Build/123.data",
      frameworkUrl: "Build/123.framework.js",
      codeUrl: "Build/123.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Julio Pepe",
      productName: "Angeli Advocacia",
      productVersion: "1.0",
    }, (progress) => {

      // segurança: se passou de 90%, já pode esconder
      if (progress > 0.9 && loading)
        loading.classList.add("hidden");

    }).then((unityInstance) => {

      if (loading) {
        loading.classList.add("hidden");
        setTimeout(() => loading.remove(), 500);
      }

    }).catch((message) => {
      alert(message);
    });
  </script>

</body>
</html>
